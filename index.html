<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>StyleCitizen</title>
  <link rel="stylesheet" href="estilo.css">        <!--  # esto conecta la cabeza con el archivo .css del estilo --> 
</head>
<body>

  <header>
    <h1>StyleCitizen</h1>
    <p>Armor Builder</p>
  </header>

  <main>   <!-- se "abre" el cuerpo -->

<section id="maniqui">
  <svg id="svg-maniqui" width="220" height="460">
    
    <!-- Cabeza -->
    <ellipse cx="110" cy="45" rx="30" ry="35" fill="#1e3248"/>
    
    <!-- Torso -->
    <rect x="60" y="90" width="100" height="120" rx="10" fill="#1e3248"/>
    
    <!-- Brazo izquierdo -->
    <rect x="30" y="95" width="25" height="100" rx="8" fill="#1e3248"/>
    
    <!-- Brazo derecho -->
    <rect x="165" y="95" width="25" height="100" rx="8" fill="#1e3248"/>
    
    <!-- Pierna izquierda -->
    <rect x="65" y="215" width="38" height="130" rx="8" fill="#1e3248"/>
    
    <!-- Pierna derecha -->
    <rect x="117" y="215" width="38" height="130" rx="8" fill="#1e3248"/>

  </svg>
</section>

    <section id="catalogo">
      <h2>Catálogo</h2>
       
      <button id="btn-casco">Casco</button>   <!-- Esto son los botones de cada parte de armadura -->
      <button id="btn-torso">Torso</button>
      <button id="btn-brazos">Brazos</button>
      <button id="btn-piernas">Piernas</button>
    </section>

  </main>  <!-- se "cierra" el cuerpo -->

  <script src="logica.js"></script>  <!-- esto conecta el archivo de logica.js al index, en el cuerpo -->
</body>
</html>
